<div class="bg-light min-vh-100 d-flex justify-content-center align-items-center">
  <div class="login-box p-4 px-4 rounded-4 shadow-lg" style="max-width: 400px; width: 100%; background: #fff;">
    <div class="text-center mb-4">
      <img src="assets/logo.png" alt="Candy Express Logo" style="height: 50px;" />
      <h2 class="mt-3 fw-bold text-dark">Login</h2>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Username</label>
        <input
          id="username"
          type="text"
          class="form-control"
          [ngClass]="{'is-invalid': username.invalid && (username.dirty || username.touched)}"
          placeholder="Enter username"
          formControlName="username"
          autocomplete="username"
        />
        <div *ngIf="username.invalid && (username.dirty || username.touched)" class="invalid-feedback">
          Username is required
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          [ngClass]="{'is-invalid': password.invalid && (password.dirty || password.touched)}"
          placeholder="Enter password"
          formControlName="password"
          autocomplete="current-password"
        />
        <div *ngIf="password.invalid && (password.dirty || password.touched)" class="invalid-feedback">
          Password is required
        </div>
      </div>

      <button type="submit"
              class="btn btn-warning w-100 fw-bold"
              [disabled]="loginForm.invalid"
              style="border-radius: 12px; box-shadow: 0 2px 8px rgba(255,165,0,0.10);">
        Login
      </button>
    </form>
  </div>
</div>
