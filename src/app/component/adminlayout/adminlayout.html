<header class="d-flex align-items-center border-bottom p-2 px-3" style="background-color: #f6ecdb; z-index: 1020;">
  <div class="container-fluid">
    <div class="row w-100 align-items-center">
      <div class="col-8 col-lg-3 d-flex align-items-center">
        <img src="assets/logo.png" (click)="homePage()" alt="Candy Express Photography" class="img-fluid"
          style="cursor: pointer; max-height: 40px;" />
      </div>

      <div class="col-lg-7 d-none d-lg-block">
      </div>

      <div class="col-4 col-lg-2 d-flex justify-content-end d-lg-none">
        <button class="btn btn-outline-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu"
          aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
          &#9776;
        </button>
      </div>
    </div>
  </div>
</header>

<div class="d-flex flex-grow-1" style="min-height: calc(100vh - 56px);">

  <div class="offcanvas offcanvas-start sidebar-custom d-lg-block flex-shrink-0" [class.collapsed]="sidebarCollapsed"
    tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
    <div class="offcanvas-header border-bottom d-lg-none">
      <h5 class="offcanvas-title text-white" id="sidebarMenuLabel">Menu</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body p-3 d-flex flex-column h-100">
      <button
        class="btn btn-warning w-100 mb-3 text-white fw-bold rounded-3 d-flex"
        (click)="createnew()">
        <i class="bi bi-plus"></i>
        <span class="ms-2">Create new client</span>
      </button>

      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item mb-2">
          <a [routerLink]="['/admindashboard']" class="nav-link sidebar-link d-flex align-items-center"
            routerLinkActive="sidebar-active" [routerLinkActiveOptions]="{ exact: true }">
            <i class="bi bi-house-door me-2"></i><span> Dashboard</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer mt-auto pt-3 border-top d-flex flex-column text-white">
        <div class="d-flex align-items-center mb-2">
          <i class="bi bi-person-circle me-3 fs-3"></i>
          <span class="fw-bold">{{currentUserName$ | async}}</span>
        </div>

        <button class="btn btn-warning fw-bold" style="border-radius: 8px" (click)="logout()">
          <i class="bi bi-box-arrow-right me-1"></i> <span>Logout</span>
        </button>
        <button class="btn btn-outline-warning d-none d-lg-inline-flex align-items-center mt-3"
          style="border-radius: 8px; padding: 6px 12px;" (click)="toggleSidebar()"
          aria-label="Toggle sidebar">
          <i style="size: 1.0rem !important;" [ngClass]="{'bi-chevron-double-left': !sidebarCollapsed, 'bi-chevron-double-right': sidebarCollapsed}" class="fs-4"></i>
        <span>Collapse</span>
        </button>
      </div>
    </div>
  </div>

  <main class="col p-4 overflow-auto">
    <router-outlet></router-outlet>
  </main>
</div>
