<div class="row align-items-center mb-4">
  <!-- Category Label (optional) -->
  <div class="col-12 col-md-2 fw-semibold mb-2 mb-md-0">
    Category 1
  </div>

  <!-- File Input -->
  <div class="col-12 col-md-5">
    <input
      type="file"
      id="category1"
      name="category1"
      accept="image/*"
      (change)="onFileSelected($event, 'category1')"
      class="form-control"
      required
    />
  </div>

  <!-- Upload Button -->
  <div class="col-6 col-md-3 mt-2 mt-md-0">
    <button
      type="button"
      class="btn btn-warning fw-bold w-100"
      [disabled]="!selectedFiles['category1']"
      (click)="uploadCategory('category1')"
    >
      Upload
    </button>
  </div>

  <!-- Uploaded Count -->
  <div class="col-6 col-md-2 text-center mt-2 mt-md-0">
    <span class="badge bg-success fs-6">
      {{ uploadedCounts['category1'] || 0 }} Uploaded
    </span>
  </div>
</div>
