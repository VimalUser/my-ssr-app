<section class="dashboard-content">
  <h2 class="mb-4 fw-bold">Upload Pictures</h2>

  <form novalidate>
    <div class="mb-4">
      <label for="category1" class="form-label fw-semibold">Category 1</label>
      <input
        type="file"
        id="category1"
        name="category1"
        accept="image/*"
        (change)="onFileSelected($event, 'category1')"
        class="form-control mb-2"
        required
      />
     <button
  type="button"
  class="btn btn-warning fw-bold px-4"
  [disabled]="!selectedFiles['category1']"
  (click)="uploadCategory('category1')"
>
  Upload Category 1
</button>
    </div>

    <div class="mb-4">
      <label for="category2" class="form-label fw-semibold">Category 2</label>
      <input
        type="file"
        id="category2"
        name="category2"
        accept="image/*"
        (change)="onFileSelected($event, 'category2')"
        class="form-control mb-2"
        required
      />
    
      <button
  type="button"
  class="btn btn-warning fw-bold px-4"
  [disabled]="!selectedFiles['category2']"
  (click)="uploadCategory('category2')"
>
  Upload Category 2
</button>
    </div>

    <div class="mb-4">
      <label for="category3" class="form-label fw-semibold">Category 3</label>
      <input
        type="file"
        id="category3"
        name="category3"
        accept="image/*"
        (change)="onFileSelected($event, 'category3')"
        class="form-control mb-2"
        required
      />
    <button
  type="button"
  class="btn btn-warning fw-bold px-4"
  [disabled]="!selectedFiles['category3']"
  (click)="uploadCategory('category3')"
>
  Upload Category 3
</button>
    </div>
  </form>
</section>
