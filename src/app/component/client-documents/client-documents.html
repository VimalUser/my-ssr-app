<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="form-title fw-bold text-dark">
            <button class="back-button">
                <img src="assets/back.png" alt="Back" class="back-arrow" (click)="goBack()"
                    style="width: 25px; height: 25px; cursor: pointer;" />
            </button>
            Client Documents
        </h5>
    </div>
    <hr  />

    <div class="card shadow-lg border-0 rounded-3 mt-4">
        <div class="card-body p-4">

            <!-- <h5 class="fw-bold mb-3">Saved Documents</h5> -->

            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>File Name</th>
                        <th style="width: 80px;">Download</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let doc of documents">
                        <td>{{ doc.fileName }}</td>
                        <td>
                            <i class="bi bi-file-earmark-arrow-down-fill text-primary"
                                style="font-size: 22px; cursor: pointer;" (click)="downloadFile(doc.id, doc.fileName)">
                            </i>

                        </td>
                    </tr>
                </tbody>
            </table>

            <div *ngIf="documents.length === 0" class="text-muted">
                No documents found.
            </div>

        </div>
    </div>
    <br />
</div>
<div *ngIf="isLoading" class="loading-container">
        <img src="assets/loading-spinner.gif" alt="Uploading...">
</div>
