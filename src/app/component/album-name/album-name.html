<div class="container py-4">

  <!-- Top header row (same as start page style) -->
  <div class="row mb-3">
    <div class="col-12 d-flex justify-content-between align-items-center">
      <button class="btn btn-link fs-4 heading-orange p-0" aria-label="Back" (click)="goBack()">
        <i class="bi bi-arrow-left"></i>
      </button>

      <div>
        <button class="btn btn-warning rounded-pill fw-bold px-4 me-2" *ngIf="!this.formData.isSubmitted" (click)="onSave()">
          Save
        </button>
        <button class="btn btn-success rounded-pill fw-bold px-4 me-2" (click)="nextStep()">
          Next <i class="bi bi-arrow-right-circle"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Main content row: left aligned step card (similar to start page) -->
  <div class="row">
    <div class="col-lg-12 col-md-11 col-sm-11">
      <div class="user-step-card">

        <div class="d-flex justify-content-between align-items-center mb-2">
          <h4 class="fw-bold mb-0 heading-orange">Album name</h4>

          <!-- adjust step text if needed -->
        </div>

        <p class="mb-4 step-subtitle">
          Kindly enter your album title and event date to continue.
        </p>

        <form class="mb-2" novalidate>
          <div class="mb-4">
            <label for="coupleName" class="form-label step-label">
              Couple Name for Album
            </label>
            <input type="text" id="coupleName" class="form-control step-input" placeholder="E.g. Arun & Priya"
            [disabled]="this.formData.isSubmitted"
              maxlength="30" [(ngModel)]="formData.albumName" name="albumName" />
            <div *ngIf="formSubmitted && (!formData.albumName || formData.albumName.trim() === '')"
              class="text-danger small mt-1">
              Album name is required.
            </div>
          </div>

          <div class="mb-3">
            <div class="mb-3">
              <label for="albumDate" class="form-label step-label">Event Date</label>
              <input type="date" id="albumDate" class="form-control step-input" [(ngModel)]="formData.albumEventDate"
              [disabled]="this.formData.isSubmitted"
                name="albumDate" (click)="openDatePicker($event)" />
              <div *ngIf="formSubmitted && (!formData.albumEventDate || formData.albumEventDate.trim() === '')"
                class="text-danger small mt-1">
                Overall album event date is required.
              </div>
            </div>
          </div>

          <!-- Event-specific date pickers (dynamic) -->
          <div *ngIf="formData.events && formData.events.length" class="mb-3">

            <div *ngFor="let ev of formData.events; let i = index" class="mb-3">
              <label class="form-label">
                {{ ev.name || ('Event ' + (i + 1)) }} <span class="text-danger">*</span>
              </label>

              <input type="date" class="form-control step-input"
              [disabled]="this.formData.isSubmitted"
                [ngModel]="formData.events[i].eventDate?.substring(0,10)"
                (ngModelChange)="formData.events[i].eventDate = $event" [name]="'eventDate_' + i"
                (click)="openDatePicker($event)" />

              <div
                *ngIf="formSubmitted && (!formData.events[i].eventDate || (formData.events[i].eventDate | date) === '')"
                class="text-danger small mt-1">
                Please select a date for {{ ev.name || ('Event ' + (i + 1)) }}.
              </div>
            </div>
          </div>
          <!-- End events list -->

        </form>

        <div class="small mt-1">
          You can edit these details later before final submission.
        </div>

      </div>
    </div>
  </div>
</div>

<div *ngIf="isLoading" class="loading-container">
  <img src="assets/loading-spinner.gif" alt="Uploading...">
</div>
