<!-- AdminDashboard.component.html -->
<section class="dashboard-content">
  <!-- Tabs -->
  <div class="d-flex flex-wrap gap-3 mb-3">
    <button
      *ngFor="let tab of tabs"
      type="button"
      class="btn"
      [ngClass]="activeTab === tab.key ? 'btn-primary fw-bold' : 'btn-outline-secondary'"
      (click)="setTab(tab.key)"
    >
      {{ tab.label }}
      <span class="badge bg-warning text-dark ms-2">{{ tab.count }}</span>
    </button>
  </div>

  <!-- Orders List -->
  <div class="d-flex flex-column gap-3">
    <div
      *ngFor="let order of orders"
      class="card shadow-sm rounded-more"
      (click)="vieworder(order.albumId)"
      style="cursor: pointer;"
    >
      <div class="card-body d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center">
        <div class="mb-2 mb-md-0">
          <div class="fs-5 fw-semibold text-dark">
            Client: {{ order.clientName }} / Order no: {{ order.orderNumber }}
          </div>
          <div class="text-muted">Event type: {{ order.eventType }}</div>
          <div class="d-flex align-items-center mt-1 text-secondary">
            <span
              class="rounded-circle me-2"
              [ngClass]="{
                'bg-secondary': order.clientStatus === 'Yet to start',
                'bg-danger': order.clientStatus === 'Cancelled',
                'bg-primary': order.clientStatus === 'Progressing',
                'bg-success': order.clientStatus === 'Completed'
              }"
              style="width: 12px; height: 12px;"
            ></span>
            {{ order.clientStatus }}
          </div>
        </div>

        <button
          class="btn btn-primary"
          (click)="$event.stopPropagation(); uploadpage(order.albumId)"
        >
          Upload Picture
        </button>
      </div>
    </div>
  </div>
</section>
