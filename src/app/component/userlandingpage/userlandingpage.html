<!-- Top navbar -->
<nav [ngClass]="{'navbar-dark bg-dark': !isLightTheme, 'navbar-light gray-mode': isLightTheme}" class="px-4 py-2 d-flex align-items-center justify-content-between" style="background-color: #f8f9fa  !important;">
  <div class="d-flex align-items-center gap-3">
    <div class="navbar-brand fw-bold fs-3" [ngClass]="{'text-orange': !isLightTheme, 'text-dark': isLightTheme}">
    <img src="assets/logo.png" alt="Candy Express Photography" class="logo" style="height:36px;" />
    </div>
  
  </div>
  <div class="d-flex align-items-center gap-3">
    <!-- <span [ngClass]="{'text-orange': !isLightTheme, 'text-dark': isLightTheme}"><i class="bi bi-star"></i> 1230 XP</span> -->
    <!-- <span [ngClass]="{'text-orange': !isLightTheme, 'text-dark': isLightTheme}">0 days</span> -->
    <!-- <img src="assets/profile.jpg" class="rounded-circle border" style="width:38px; height:38px; object-fit:cover;" alt="User" /> -->
    <button
      class="navbar-toggler ms-3 d-lg-none border-0 rounded"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#mainSidebar"
      aria-controls="mainSidebar"
      aria-label="Toggle sidebar"
      style="background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(6px);"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <button class="btn btn-outline-secondary" (click)="toggleTheme()">
      <i [class.bi-moon-fill]="!isLightTheme" [class.bi-sun-fill]="isLightTheme"></i>
    </button>
  </div>
</nav>

<div [ngClass]="{'bg-dark text-white': !isLightTheme, 'bg-gray-light text-dark': isLightTheme}" style="min-height:100vh;">
  <div class="container-fluid h-100">
    <div class="row flex-nowrap">
      <!-- Desktop Sidebar -->
      <aside [ngClass]="{'bg-dark text-white sidebar-dark': !isLightTheme, 'bg-gray-sidebar text-dark sidebar-light': isLightTheme}" class="col-auto col-xl-2 px-0 pt-4 sidebar d-none d-lg-block" style="min-height: 100vh;">
        <ng-container *ngTemplateOutlet="sidebarMenu"></ng-container>
      </aside>

<main class="col flex-grow-1 main-transparent">
  <router-outlet></router-outlet>
</main>


    </div>
  </div>
</div>

<!-- Offcanvas Sidebar for Mobile -->
<div
  class="offcanvas offcanvas-start"
  [ngClass]="{'bg-dark text-white': !isLightTheme, 'bg-gray-sidebar text-dark': isLightTheme}"
  tabindex="-1"
  id="mainSidebar"
  aria-labelledby="mainSidebarLabel"
>
  <div class="offcanvas-header">
    <h5 [ngClass]="{'text-orange': !isLightTheme, 'text-dark': isLightTheme}" id="mainSidebarLabel">Menu</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" [ngClass]="{'btn-close-white': !isLightTheme}" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body px-0 py-3">
    <ng-container *ngTemplateOutlet="sidebarMenu"></ng-container>
  </div>
</div>

<!-- Sidebar Menu Template -->
<ng-template #sidebarMenu>
  <ul class="nav nav-pills flex-column gap-2 px-3">
    <li class="nav-item" *ngFor="let item of menuItems; let i = index">
      <a class="nav-link"
         [routerLink]="!item.disabled ? item.route : null"
         routerLinkActive="active"
         [ngClass]="{
           'text-white': !isLightTheme && !item.disabled,
           'text-dark': isLightTheme && !item.disabled,
           'disabled text-secondary': item.disabled
         }"
         (click)="item.disabled && $event.preventDefault()"
         tabindex="{{ item.disabled ? -1 : 0 }}"
      >
         <i class="me-2" [class]="'bi ' + item.icon"></i>{{item.name}}
      </a>
    </li>
  </ul>
</ng-template>
